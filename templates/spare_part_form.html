{% extends "base.html" %}{% block title %}Nuevo repuesto{% endblock %}{% block top_title %}Inventario de repuestos{% endblock %}{% block content %}
<div class="page-head"><div><h1>Registrar repuesto</h1><p>Agregá el artículo al inventario para controlar su consumo.</p></div></div>
<form method="post" class="form-card"><div class="form-grid"><div class="field"><label>Código único *</label><input name="code" required placeholder="REP-001"></div><div class="field"><label>Nombre del repuesto *</label><input name="name" required placeholder="Ej. Aguja industrial"></div><div class="field"><label>Equipo asociado</label><select name="equipment_id"><option value="">General / varios equipos</option>{% for e in equipment %}<option value="{{ e.id }}">{{ e.code }} · {{ e.name }}</option>{% endfor %}</select></div><div class="field"><label>Ubicación</label><input name="location" placeholder="Ej. Almacén A"></div><div class="field"><label>Existencia inicial</label><input type="number" min="0" name="quantity" value="0" required></div><div class="field"><label>Stock mínimo</label><input type="number" min="0" name="minimum_quantity" value="2" required></div><div class="field"><label>Costo unitario ({{ currency_symbol }})</label><input type="number" step=".01" min="0" name="unit_cost" value="0"></div></div><div class="form-actions"><button>Guardar repuesto</button><a class="btn secondary" href="{{ url_for('spare_parts_list') }}">Cancelar</a></div></form>{% endblock %}
