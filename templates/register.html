{% extends "base.html" %}{% block title %}Solicitar acceso{% endblock %}{% block auth_content %}
<div class="auth-wrap"><div class="auth-card"><div class="brand"><div class="brand-mark">M</div><div class="brand-copy"><strong>MaintenIX</strong><small>Solicitud de acceso</small></div></div><h1>Crear solicitud</h1><p>El encargado de mantenimiento debe aprobar tu cuenta antes de que podás ingresar.</p><form method="post" class="auth-fields"><div class="field"><label>Nombre completo</label><input name="full_name" required autocomplete="name"></div><div class="field"><label>Correo electrónico</label><input type="email" name="email" required autocomplete="email"></div><div class="field"><label>Contraseña (mínimo 8 caracteres)</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Rol solicitado</label><select name="role" required><option value="Técnico de mantenimiento">Técnico de mantenimiento</option><option value="Supervisor de producción">Supervisor de producción</option></select></div><button type="submit">Enviar solicitud</button></form><div class="auth-foot"><a href="{{ url_for('login') }}">← Volver al inicio de sesión</a></div></div></div>{% endblock %}
