services:
  - type: web
    name: maintenix
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: MAINTENIX_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
